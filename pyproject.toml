[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raaga"
version = "0.1.0"
description = "Hindustani raga detection (research code, non-commercial)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
# Colab/Kaggle already ship torch, so it's kept optional here rather than a hard dependency --
# only pull it in explicitly for local dev/testing (pip install -e ".[dev]").
torch = ["torch"]
dev = ["pytest", "raaga[torch]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
